<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>回答記録帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一枚のマークシート風。上に記録一覧、題名と問題数、問ごとの行(イロハニ + 回答番号1〜5)、書き出しの順 */
:root {
  --bg: #edf1f7;
  --surface: #fbfcfe;
  --ink: #16202e;
  --muted: #59667a;
  --line: #cdd6e3;
  --sel: #2b3fa0;
  --on-sel: #ffffff;
  --num: #0e6f66;
  --on-num: #ffffff;
  --ok: #2b3fa0;
  --danger: #a3302a;
  --good: #1c7a3f;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1521;
    --surface: #161f2f;
    --ink: #e6ebf3;
    --muted: #94a1b5;
    --line: #2a3649;
    --sel: #92a6ff;
    --on-sel: #0e1521;
    --num: #55d3c2;
    --on-num: #0e1521;
    --ok: #92a6ff;
    --danger: #f08a82;
    --good: #6fd39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1521;
  --surface: #161f2f;
  --ink: #e6ebf3;
  --muted: #94a1b5;
  --line: #2a3649;
  --sel: #92a6ff;
  --on-sel: #0e1521;
  --num: #55d3c2;
  --on-num: #0e1521;
  --ok: #92a6ff;
  --danger: #f08a82;
  --good: #6fd39a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: 0.08em;
  margin: 0;
  text-wrap: balance;
}
.sub { color: var(--muted); font-size: 0.875rem; margin: 2px 0 0; }

.sheet {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sheet-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.sheet-head h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; letter-spacing: 0.06em; }

.rec-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 15rem; overflow-y: auto; }
.rec {
  width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 4px;
  padding: 8px 12px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.rec .t { min-width: 0; overflow-wrap: anywhere; }
.rec .t.empty { color: var(--muted); }
.rec .m { color: var(--muted); font-size: 0.8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rec[aria-current="true"] { border-color: var(--sel); background: var(--surface); }
.rec[aria-current="true"] .t { font-weight: 700; }
@media (hover: hover) { .rec:hover { border-color: var(--muted); } .rec[aria-current="true"]:hover { border-color: var(--sel); } }

.fields { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 560px) { .fields { grid-template-columns: 1fr 11rem; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lab {
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 500;
}
input[type="text"], input[type="date"] {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 11px;
  width: 100%;
  min-width: 0;
}
input[type="text"]#title { font-size: 1.05rem; font-weight: 500; }
input::placeholder { color: var(--muted); opacity: 0.8; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.bar-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 0.9rem;
  background: transparent; color: var(--ink);
  border: 0; padding: 7px 16px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); font-weight: 700; }
.progress { flex: 1 1 10rem; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.progress .txt { font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--ok); transition: width 0.2s ease; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.8rem; color: var(--muted); margin: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.dot.s { background: var(--sel); }
.dot.n { background: var(--num); }

.rows { display: flex; flex-direction: column; }
.row {
  display: grid;
  grid-template-columns: 2.6rem 1fr;
  gap: 8px 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.qn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  text-align: center;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.row.done .qn { color: var(--ok); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px 22px; min-width: 0; }
.group { display: flex; align-items: center; gap: 6px; }
.group .lab { width: 2rem; flex: none; }
.chip {
  width: 42px; height: 42px;
  font: inherit; font-size: 1.05rem; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg);
  color: var(--ink);
  border: 1.5px solid var(--line);
  cursor: pointer;
  padding: 0;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.chip.k { border-radius: 4px; }
.chip.n { border-radius: 50%; font-variant-numeric: tabular-nums; }
.chip.k[aria-pressed="true"] { background: var(--sel); border-color: var(--sel); color: var(--on-sel); font-weight: 700; }
.chip.n[aria-pressed="true"] { background: var(--num); border-color: var(--num); color: var(--on-num); font-weight: 700; }
.chip.c { border-radius: 50%; font-variant-numeric: tabular-nums; }
.chip.c[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.group.key .lab { color: var(--ink); font-weight: 700; }
.qn { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.qn .mk { font-family: var(--font-body); font-size: 1.05rem; font-weight: 700; min-height: 1.3em; }
.row.ok .mk { color: var(--good); }
.row.ng .mk { color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.score .big { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
.score .note { font-size: 0.85rem; color: var(--muted); }
.chip:disabled { cursor: default; }
.chip:disabled[aria-pressed="false"] { opacity: 0.5; }
@media (hover: hover) { .chip:not(:disabled):hover { border-color: var(--muted); } }

.out { display: flex; flex-direction: column; gap: 10px; }
.out h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; letter-spacing: 0.06em; }
textarea {
  font: inherit; font-size: 0.9rem; line-height: 1.55;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 11px; width: 100%; min-height: 11rem; resize: vertical;
  font-variant-numeric: tabular-nums;
}
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-size: 0.9rem; cursor: pointer;
  border-radius: 4px; padding: 8px 16px;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--sel); border-color: var(--sel); color: var(--on-sel); font-weight: 700; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.msg { font-size: 0.85rem; color: var(--muted); }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 0.9rem; }
.confirm span { color: var(--danger); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>回答記録帳</h1>
    <p class="sub">イ・ロ・ハ・ニの選択と、回答番号 1〜5 を問ごとに記録します。記録は題名ごとに保存されます。</p>
  </header>

  <section class="sheet" aria-label="記録の一覧">
    <div class="sheet-head">
      <h2>記録の一覧</h2>
      <button type="button" class="btn primary" id="new-rec">＋ 新しい記録</button>
    </div>
    <ul class="rec-list" id="rec-list"></ul>
  </section>

  <section class="sheet" aria-label="問題の情報">
    <div class="fields">
      <div class="field">
        <label for="title">題名</label>
        <input type="text" id="title" placeholder="例:乙種機械 令和5年度 法令" autocomplete="off">
      </div>
      <div class="field">
        <label for="date">実施日</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="bar-row">
      <div>
        <div class="lab" id="cnt-lab" style="margin-bottom:4px">問題数</div>
        <div class="seg" role="group" aria-labelledby="cnt-lab">
          <button type="button" data-count="15" aria-pressed="false">15問</button>
          <button type="button" data-count="20" aria-pressed="true">20問</button>
        </div>
      </div>
      <div class="progress">
        <div class="txt" id="prog-txt">入力済み 0 / 20</div>
        <div class="track"><div class="fill" id="prog-fill"></div></div>
      </div>
    </div>
    <div class="bar-row">
      <button type="button" class="btn" id="check-toggle" aria-pressed="false">答え合わせをする</button>
      <span class="msg">解き終わったら押すと、各問に正解の欄が出て自動で採点します。</span>
    </div>
    <div class="score" id="score" hidden>
      <span class="lab">点数</span>
      <span class="big" id="score-big">0/20</span>
      <span class="note" id="score-note"></span>
    </div>
  </section>

  <section class="sheet" aria-label="解答欄">
    <p class="legend">
      <span><i class="dot s"></i>選択:複数選べます</span>
      <span><i class="dot n"></i>回答番号:1つだけ選べます(もう一度押すと外れます)</span>
    </p>
    <div class="rows" id="rows"></div>
  </section>

  <section class="sheet out" aria-label="記録の書き出し">
    <h2>記録の書き出し</h2>
    <textarea id="summary" readonly aria-label="記録テキスト"></textarea>
    <div class="btns">
      <button type="button" class="btn primary" id="copy">コピー</button>
      <span id="del-area"><button type="button" class="btn danger" id="del">この記録を削除</button></span>
      <span class="msg" id="msg" role="status"></span>
    </div>
  </section>
</div>

<script>
(function () {
  var KANA = ['イ', 'ロ', 'ハ', 'ニ'];
  var KEY_V1 = 'exam-answer-log-v1';
  var KEY = 'exam-answer-log-v2';
  var MAX = 20;

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function newId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function newRec(count) { return { id: newId(), title: '', date: todayStr(), count: count === 15 ? 15 : 20, a: {}, key: {}, check: false }; }

  function cleanRec(s) {
    if (!s || typeof s !== 'object') return null;
    var r = newRec(s.count);
    r.id = typeof s.id === 'string' && s.id ? s.id : r.id;
    r.title = typeof s.title === 'string' ? s.title : '';
    r.date = typeof s.date === 'string' && s.date ? s.date : r.date;
    r.a = s.a && typeof s.a === 'object' ? s.a : {};
    r.key = s.key && typeof s.key === 'object' ? s.key : {};
    r.check = !!s.check;
    return r;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.records)) {
          var recs = s.records.map(cleanRec).filter(Boolean);
          if (recs.length) {
            var ok = recs.some(function (r) { return r.id === s.currentId; });
            return { records: recs, currentId: ok ? s.currentId : recs[0].id };
          }
        }
      }
    } catch (e) {}
    try {
      var old = localStorage.getItem(KEY_V1);
      if (old) {
        var r = cleanRec(JSON.parse(old));
        if (r) return { records: [r], currentId: r.id };
      }
    } catch (e) {}
    var f = newRec(20);
    return { records: [f], currentId: f.id };
  }

  var data = load();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function cur() {
    for (var i = 0; i < data.records.length; i++) if (data.records[i].id === data.currentId) return data.records[i];
    return data.records[0];
  }
  function get(r, q) {
    if (!r.a[q]) r.a[q] = { sel: [], num: null };
    return r.a[q];
  }
  function touched(a) { return !!a && a.num !== null && a.num !== undefined; }
  function progressOf(r) {
    var n = 0;
    for (var q = 1; q <= r.count; q++) if (touched(r.a[q])) n++;
    return n;
  }

  function scoreOf(r) {
    var correct = 0, keyed = 0;
    for (var q = 1; q <= r.count; q++) {
      var k = r.key[q];
      if (k) {
        keyed++;
        var a = r.a[q];
        if (a && a.num === k) correct++;
      }
    }
    return { correct: correct, keyed: keyed };
  }

  var rowsEl = document.getElementById('rows');
  var listEl = document.getElementById('rec-list');
  var titleEl = document.getElementById('title');
  var dateEl = document.getElementById('date');
  var sumEl = document.getElementById('summary');
  var msgEl = document.getElementById('msg');
  var rowEls = [];

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  }

  function buildRows() {
    for (var q = 1; q <= MAX; q++) {
      (function (q) {
        var row = mk('div', 'row');
        var qn = mk('div', 'qn');
        qn.appendChild(mk('span', null, String(q)));
        qn.appendChild(mk('span', 'mk', ''));
        row.appendChild(qn);
        var ctrls = mk('div', 'ctrls');

        var g1 = mk('div', 'group');
        g1.setAttribute('role', 'group');
        g1.setAttribute('aria-label', '第' + q + '問 選択');
        g1.appendChild(mk('span', 'lab', '選択'));
        KANA.forEach(function (k) {
          var b = mk('button', 'chip k', k);
          b.type = 'button';
          b.dataset.kana = k;
          b.setAttribute('aria-pressed', 'false');
          b.setAttribute('aria-label', '第' + q + '問 ' + k);
          b.addEventListener('click', function () {
            var a = get(cur(), q);
            var i = a.sel.indexOf(k);
            if (i >= 0) a.sel.splice(i, 1); else a.sel.push(k);
            a.sel.sort(function (x, y) { return KANA.indexOf(x) - KANA.indexOf(y); });
            paintRow(q);
            changed();
          });
          g1.appendChild(b);
        });

        var g2 = mk('div', 'group');
        g2.setAttribute('role', 'group');
        g2.setAttribute('aria-label', '第' + q + '問 回答番号');
        g2.appendChild(mk('span', 'lab', '回答'));
        for (var n = 1; n <= 5; n++) {
          (function (n) {
            var b = mk('button', 'chip n', String(n));
            b.type = 'button';
            b.dataset.num = String(n);
            b.setAttribute('aria-pressed', 'false');
            b.setAttribute('aria-label', '第' + q + '問 回答番号' + n);
            b.addEventListener('click', function () {
              var a = get(cur(), q);
              a.num = a.num === n ? null : n;
              paintRow(q);
              changed();
            });
            g2.appendChild(b);
          })(n);
        }

        var g3 = mk('div', 'group key');
        g3.hidden = true;
        g3.setAttribute('role', 'group');
        g3.setAttribute('aria-label', '第' + q + '問 正解');
        g3.appendChild(mk('span', 'lab', '正解'));
        for (var m = 1; m <= 5; m++) {
          (function (m) {
            var b = mk('button', 'chip c', String(m));
            b.type = 'button';
            b.dataset.key = String(m);
            b.setAttribute('aria-pressed', 'false');
            b.setAttribute('aria-label', '第' + q + '問 正解' + m);
            b.addEventListener('click', function () {
              var r = cur();
              if (r.key[q] === m) delete r.key[q]; else r.key[q] = m;
              paintRow(q);
              changed();
            });
            g3.appendChild(b);
          })(m);
        }

        ctrls.appendChild(g1);
        ctrls.appendChild(g2);
        ctrls.appendChild(g3);
        row.appendChild(ctrls);
        rowsEl.appendChild(row);
        rowEls[q] = row;
      })(q);
    }
  }

  function paintRow(q) {
    var row = rowEls[q];
    var a = get(cur(), q);
    row.querySelectorAll('.chip.k').forEach(function (b) {
      b.setAttribute('aria-pressed', a.sel.indexOf(b.dataset.kana) >= 0 ? 'true' : 'false');
    });
    row.querySelectorAll('.chip.n').forEach(function (b) {
      b.setAttribute('aria-pressed', a.num === Number(b.dataset.num) ? 'true' : 'false');
    });
    row.classList.toggle('done', touched(a));
    var r = cur();
    row.querySelectorAll('.chip.k, .chip.n').forEach(function (b) { b.disabled = !!r.check; });
    var key = r.key[q] || null;
    row.querySelectorAll('.chip.c').forEach(function (b) {
      b.setAttribute('aria-pressed', key === Number(b.dataset.key) ? 'true' : 'false');
    });
    row.querySelector('.group.key').hidden = !r.check;
    var res = '';
    if (r.check && key) res = (a.num === key) ? 'ok' : 'ng';
    row.classList.toggle('ok', res === 'ok');
    row.classList.toggle('ng', res === 'ng');
    row.querySelector('.mk').textContent = res === 'ok' ? '○' : (res === 'ng' ? '×' : '');
  }

  function summaryText(r) {
    var lines = [];
    lines.push('題名:' + (r.title.trim() || '(未入力)'));
    lines.push('実施日:' + (r.date || '(未入力)'));
    var sc = scoreOf(r);
    if (sc.keyed) lines.push('点数:' + sc.correct + '/' + r.count + (sc.keyed < r.count ? '(正解未入力 ' + (r.count - sc.keyed) + '問)' : ''));
    lines.push('');
    for (var q = 1; q <= r.count; q++) {
      var a = get(r, q);
      var sel = a.sel.length ? a.sel.join('・') : '―';
      var num = a.num !== null ? String(a.num) : '―';
      var kq = r.key[q];
      var tail = kq ? '  正解:' + kq + (a.num === kq ? ' ○' : ' ×') : '';
      lines.push('第' + String(q).padStart(2, ' ') + '問  選択:' + sel + '  回答:' + num + tail);
    }
    return lines.join('\n');
  }

  function renderList() {
    listEl.innerHTML = '';
    data.records.slice().reverse().forEach(function (r) {
      var li = mk('li');
      var b = mk('button', 'rec');
      b.type = 'button';
      b.setAttribute('aria-current', r.id === data.currentId ? 'true' : 'false');
      var t = mk('span', 't' + (r.title.trim() ? '' : ' empty'), r.title.trim() || '(題名なし)');
      var sc = scoreOf(r);
      var scTxt = sc.keyed ? ' ・ ' + sc.correct + '/' + r.count + '点' + (sc.keyed < r.count ? '(途中)' : '') : '';
      var m = mk('span', 'm', (r.date || '日付なし') + ' ・ 入力 ' + progressOf(r) + '/' + r.count + scTxt);
      b.appendChild(t);
      b.appendChild(m);
      b.addEventListener('click', function () { switchTo(r.id); });
      li.appendChild(b);
      listEl.appendChild(li);
    });
  }

  function refresh() {
    var r = cur();
    var done = progressOf(r);
    for (var q = 1; q <= MAX; q++) rowEls[q].hidden = q > r.count;
    document.getElementById('prog-txt').textContent = '入力済み ' + done + ' / ' + r.count;
    document.getElementById('prog-fill').style.width = (done / r.count * 100) + '%';
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', Number(b.dataset.count) === r.count ? 'true' : 'false');
    });
    var sc = scoreOf(r);
    document.getElementById('score').hidden = !(r.check || sc.keyed > 0);
    document.getElementById('score-big').textContent = sc.correct + '/' + r.count;
    document.getElementById('score-note').textContent = sc.keyed < r.count
      ? '正解が未入力の問題が ' + (r.count - sc.keyed) + ' 問あります'
      : '全問を採点しました';
    var tg = document.getElementById('check-toggle');
    tg.setAttribute('aria-pressed', r.check ? 'true' : 'false');
    tg.textContent = r.check ? '答え合わせを終える' : '答え合わせをする';
    sumEl.value = summaryText(r);
    renderList();
  }

  function changed() { save(); refresh(); msgEl.textContent = ''; }

  function loadCurrentIntoForm() {
    var r = cur();
    titleEl.value = r.title;
    dateEl.value = r.date;
    for (var q = 1; q <= MAX; q++) paintRow(q);
    refresh();
  }

  function switchTo(id) {
    data.currentId = id;
    save();
    resetDelete();
    msgEl.textContent = '';
    loadCurrentIntoForm();
  }

  titleEl.addEventListener('input', function () { cur().title = titleEl.value; changed(); });
  dateEl.addEventListener('input', function () { cur().date = dateEl.value; changed(); });
  document.getElementById('check-toggle').addEventListener('click', function () {
    var r = cur();
    r.check = !r.check;
    for (var q = 1; q <= MAX; q++) paintRow(q);
    changed();
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { cur().count = Number(b.dataset.count); changed(); });
  });

  document.getElementById('new-rec').addEventListener('click', function () {
    var r = newRec(cur().count);
    data.records.push(r);
    data.currentId = r.id;
    save();
    resetDelete();
    loadCurrentIntoForm();
    msgEl.textContent = '新しい記録を作りました。題名を入力してください';
    titleEl.focus();
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = sumEl.value;
    function fallback() {
      sumEl.removeAttribute('readonly');
      sumEl.focus();
      sumEl.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      sumEl.setAttribute('readonly', '');
      msgEl.textContent = ok ? 'コピーしました' : 'テキストを選択しました。コピーしてください';
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        msgEl.textContent = 'コピーしました';
      }, fallback);
    } catch (e) { fallback(); }
  });

  var delArea = document.getElementById('del-area');
  function resetDelete() {
    delArea.innerHTML = '';
    var b = mk('button', 'btn danger', 'この記録を削除');
    b.type = 'button';
    b.addEventListener('click', askDelete);
    delArea.appendChild(b);
  }
  function askDelete() {
    var r = cur();
    delArea.innerHTML = '';
    var box = mk('span', 'confirm');
    box.appendChild(mk('span', null, '「' + (r.title.trim() || '題名なし') + '」を削除します。'));
    var yes = mk('button', 'btn danger', '削除する');
    yes.type = 'button';
    yes.addEventListener('click', function () {
      var idx = data.records.indexOf(r);
      data.records.splice(idx, 1);
      if (!data.records.length) data.records.push(newRec(r.count));
      var next = data.records[Math.min(idx, data.records.length - 1)];
      data.currentId = next.id;
      save();
      resetDelete();
      loadCurrentIntoForm();
      msgEl.textContent = '削除しました';
    });
    var no = mk('button', 'btn', 'やめる');
    no.type = 'button';
    no.addEventListener('click', resetDelete);
    box.appendChild(yes);
    box.appendChild(no);
    delArea.appendChild(box);
  }

  buildRows();
  resetDelete();
  loadCurrentIntoForm();
})();
</script>

</body></html>
